[package]
name = "toluca-recomp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
toluca-core = { path = "../toluca-core" }
iced-x86 = "1.21"
cranelift-codegen = { version = "0.130", default-features = false, features = ["std", "x86", "arm64"] }
cranelift-frontend = "0.130"
target-lexicon = "0.13"

[dev-dependencies]
libc = "0.2"

[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
unicorn-engine = { version = "2.1", default-features = false, features = ["arch_x86"] }
